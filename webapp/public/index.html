<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>We Should Be Ashamed...</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Same design system as the mock prototype -- felt table, flip cards.
     See that file's own comment block for the full rationale; this is the
     real thing wired to /api/state, /api/play, /api/choose instead of
     canned sample data. */
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&family=Archivo:wght@700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    --felt: #171319; --felt-2: #1d1821; --card-black: #0c0b10; --ivory: #f4efe4;
    --ink: #18151d; --plum: #3a2f45; --plum-dark: #241d2c; --gold: #d9a441;
    --gold-deep: #b98328; --muted: #9a8fa3; --line: rgba(244, 239, 228, 0.14);
    --shadow: rgba(0, 0, 0, 0.55); --bad: #c26b4f;
    --font-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
    --font-card: 'Archivo', 'Arial Narrow', Helvetica, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--felt);
    background-image:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(217, 164, 65, 0.08), transparent 60%),
      radial-gradient(ellipse 140% 100% at 50% 110%, rgba(0, 0, 0, 0.6), transparent 60%);
    color: var(--ivory); font-family: var(--font-card); min-height: 100vh;
    margin: 0; padding: 24px 16px 40px; display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 16px; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .masthead h1 {
    font-family: var(--font-display); font-weight: 700; font-style: italic;
    font-size: 1.4rem; margin: 0; letter-spacing: 0.01em; text-wrap: balance;
  }
  .badge {
    font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.08em;
    color: var(--felt); background: var(--gold); padding: 3px 7px; border-radius: 3px;
    white-space: nowrap; transform: translateY(-2px); cursor: default;
  }

  /* dev-only connection bar -- only shown when we're NOT inside Telegram
     (no initData available), so you can punch in a chat id / your telegram
     user id from a plain browser on the LAN to test against a real game. */
  .devbar {
    display: flex; gap: 6px; font-family: var(--font-mono); font-size: 0.72rem;
    background: var(--felt-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px;
  }
  .devbar input {
    flex: 1; min-width: 0; background: var(--card-black); color: var(--ivory);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-family: inherit;
  }
  .devbar button {
    font-family: inherit; background: var(--gold); color: var(--ink); border: none;
    border-radius: 6px; padding: 6px 10px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }

  .readout {
    display: flex; align-items: center; gap: 10px; font-family: var(--font-mono);
    font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 9px 2px; flex-wrap: wrap;
  }
  .readout .turn { color: var(--ivory); font-weight: 600; font-variant-numeric: tabular-nums; }
  .readout .role { margin-left: auto; color: var(--gold); }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 18px; }

  .msg {
    font-family: var(--font-display); font-style: italic; font-size: 0.98rem;
    color: var(--muted); text-align: center; text-wrap: balance; padding: 20px 8px;
  }
  .msg.err { color: var(--bad); }

  .black-card {
    /* Was max-width 320px @ aspect-ratio 5/4 (landscape, wider than tall) --
       on a phone that reads as a squat rectangle, not a "card." Switched to
       the same portrait ratio the judge's flip-cards already use (5/6.6)
       and pulled max-width in so it doesn't just get chunkier at the new
       ratio -- now it actually looks like the same deck as everything else. */
    position: relative; width: 100%; max-width: 280px; aspect-ratio: 5 / 6.6;
    background: var(--card-black); border-radius: 14px; padding: 22px;
    display: flex; align-items: flex-start; justify-content: flex-start;
    box-shadow: 0 18px 34px var(--shadow), 0 2px 0 rgba(255,255,255,0.03) inset;
    transform: rotate(-1.6deg);
  }
  .black-card p {
    font-family: var(--font-card); font-weight: 800; font-size: 1.28rem;
    line-height: 1.28; color: var(--ivory); margin: 0; text-wrap: balance;
  }
  .black-card .pick-tag {
    position: absolute; bottom: 16px; right: 18px; font-family: var(--font-mono);
    font-size: 0.66rem; letter-spacing: 0.08em; color: var(--gold);
    border: 1px solid var(--gold); padding: 3px 7px; border-radius: 3px;
  }
  /* Only applied when JS detects the turn number actually changed (see
     render()'s isNewTurn check) -- render() used to redraw the black card
     from scratch on every 4s poll tick, including polls where nothing
     changed, so this "settle" fade used to silently replay every 4 seconds
     forever, not just when a new card actually landed. Now it's reserved
     for the moment a fresh black card actually gets dealt: a bigger, more
     "tossed onto the table" motion instead of a plain fade. */
  .black-card.deal-in { animation: dealIn 1.05s cubic-bezier(.2,.85,.3,1.3) both; }
  @keyframes dealIn {
    /* Exaggerated further + slowed down per Jon's ask: bigger drop, bigger
       spin, bigger overshoot before it settles into its resting tilt. */
    0%   { opacity: 0; transform: translateY(-170px) rotate(28deg) scale(0.55); }
    55%  { opacity: 1; transform: translateY(26px) rotate(-13deg) scale(1.14); }
    100% { opacity: 1; transform: translateY(0) rotate(-1.6deg) scale(1); }
  }

  .hand-label {
    font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.08em;
    color: var(--muted); text-transform: uppercase; text-align: center;
  }
  /* Was a horizontally-scrolling flex row with a heavy negative-margin fan --
     forced left/right scrolling to reach the end cards, and most of each
     card's face was hidden under its neighbor, so you had to lift a card
     just to read it. Replaced with a 4-column grid: everything fits the
     screen width with no horizontal scroll, and each card is fully visible
     side-to-side. Cards from the 5th on (i.e. row two onward) get pulled up
     to overlap the bottom third of the row above -- a vertical fan instead
     of a horizontal one -- purely cosmetic (deck-of-cards look) since the
     overlapped strip is normally blank space below the card text, not text
     itself. */
  .hand-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    column-gap: 6px; row-gap: 0; padding: 20px 6px 14px;
  }
  .white-card {
    aspect-ratio: 5 / 6.4; background: var(--ivory);
    color: var(--ink); border-radius: 10px; padding: 9px 8px; font-family: var(--font-card);
    font-weight: 700; font-size: 0.72rem; line-height: 1.16; box-shadow: 0 10px 20px var(--shadow);
    cursor: pointer; overflow: hidden;
    /* Bouncier "back out" easing (overshoots slightly past its resting
       transform, then settles) instead of a plain ease-out -- reads as a
       playful pop on select and an equally playful settle back down on
       deselect, since it's the same transition running both directions.
       NOTE: this only animates when the class toggles on a DOM node that
       stays alive across the change -- see selectCard() in the script,
       which mutates the existing card elements in place instead of the old
       tear-down-and-rebuild-the-whole-grid approach. A transition can't
       animate a class that's already present the instant an element is
       created, only a change on an element that was already there. */
    /* Slowed down further per Jon's ask -- 0.5s instead of 0.34s, so the
       overshoot actually reads instead of snapping past. */
    transition: transform 0.5s cubic-bezier(.34,1.56,.64,1), box-shadow 0.4s ease, border-color 0.3s ease;
    border: 2px solid transparent; text-wrap: balance;
  }
  /* -42.6% is 1/3 of the card's own height expressed as a percentage of its
     width (margin percentages resolve against the containing block's WIDTH
     even for margin-top) -- since the card's height is fixed at 1.28x its
     width via aspect-ratio, this stays exactly "1/3 of the card" overlap no
     matter how narrow the columns end up on a given phone. */
  .hand-grid .white-card:nth-child(n+5) { margin-top: -42.6%; z-index: 2; }
  .white-card:active { transform: scale(0.94); }
  .white-card.selected {
    /* Exaggerated further per Jon's ask -- an even bigger lift/pop/tilt. */
    transform: translateY(-46px) scale(1.26) rotate(-9deg);
    box-shadow: 0 30px 48px var(--shadow); border-color: var(--gold); z-index: 5;
  }
  .white-card.disabled { opacity: 0.4; pointer-events: none; }

  .play-bar { position: sticky; bottom: 0; display: flex; justify-content: center; padding-top: 4px; }
  .play-btn {
    font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.03em;
    background: var(--gold); color: var(--ink); border: none; border-radius: 999px;
    padding: 12px 22px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 20px rgba(217,164,65,0.35);
    transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .play-btn:hover { background: var(--gold-deep); }
  .play-btn[disabled] { opacity: 0; pointer-events: none; transform: translateY(8px); }

  .played-note {
    font-family: var(--font-display); font-style: italic; font-size: 0.86rem;
    color: var(--muted); text-align: center; min-height: 1.4em;
  }

  /* width:100% is load-bearing: .stage's `align-items: center` doesn't
     stretch its children, and .flip-card's only content is absolutely
     positioned (so it contributes nothing to shrink-to-fit sizing) --
     without an explicit width here the whole row collapses toward 0px.
     Chrome rounded that up to a visible sliver (clickable but textless);
     iOS Safari rounded it down to fully invisible. Same bug, two faces. */
  .judge-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 4px 2px 8px; width: 100%; }
  .flip-card { position: relative; perspective: 1000px; aspect-ratio: 5 / 6.6; }
  .flip-inner {
    position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    /* Slowed down per Jon's ask -- a more theatrical flip. */
    transition: transform 0.8s cubic-bezier(.3,.9,.3,1);
  }
  .flip-card.flipped .flip-inner { transform: rotateY(180deg); }
  .flip-face {
    position: absolute; inset: 0; border-radius: 10px; backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center; padding: 12px;
    box-shadow: 0 10px 20px var(--shadow);
  }
  .flip-back {
    background: repeating-linear-gradient(45deg, var(--plum) 0 6px, var(--plum-dark) 6px 12px);
    border: 2px solid rgba(217,164,65,0.35); cursor: pointer;
  }
  .flip-back .emblem { width: 30px; height: 30px; border: 2px solid var(--gold); transform: rotate(45deg); opacity: 0.7; }
  .flip-front {
    background: var(--ivory); color: var(--ink); transform: rotateY(180deg);
    font-family: var(--font-card); font-weight: 700; font-size: 0.84rem; line-height: 1.24;
    text-align: left; align-items: flex-start; flex-direction: column; gap: 8px;
    cursor: pointer; border: 2px solid transparent; transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  /* Crowning a winner (see crownWinner() in the script): the picked card
     gets a gold pulse + a crown emoji popping in from above, everyone else
     shrinks and fades -- then after a beat the round actually advances.

     IMPORTANT: the winner/loser scale+fade lives on .flip-card (the OUTER
     wrapper), not .flip-inner (the element that actually carries the
     rotateY(180deg) flip). Putting a scale() on the SAME element as the
     flip's rotateY(180deg) -- even though the math shouldn't care -- made
     Chrome flip which face's backface-visibility won, so the "loser" card
     silently flopped back to showing its card-BACK design instead of
     fading out its front. Confirmed by hit-testing the rendered pixels
     (elementFromPoint), not just reading computed transforms. Keeping the
     flip rotation and the celebration scale on two different elements
     sidesteps the interaction entirely. */
  .flip-card.winner .flip-front {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(217,164,65,0.35), 0 0 26px rgba(217,164,65,0.5), 0 14px 26px var(--shadow);
  }
  .flip-card.winner { animation: crownPulse 1.2s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes crownPulse {
    /* Exaggerated further + slowed down -- a real wobble, not a nudge. */
    0%   { transform: scale(1); }
    25%  { transform: scale(1.42) rotate(-8deg); }
    48%  { transform: scale(0.85) rotate(7deg); }
    68%  { transform: scale(1.2) rotate(-4deg); }
    85%  { transform: scale(0.97) rotate(2deg); }
    100% { transform: scale(1.1) rotate(0deg); }
  }
  .flip-card.loser {
    opacity: 0.25; transform: scale(0.82) rotate(-3deg);
    transition: transform 0.7s ease, opacity 0.7s ease;
  }
  .flip-card.loser .crown-btn { visibility: hidden; }
  .crown-pop {
    position: absolute; top: -30px; left: 50%; font-size: 2.9rem; line-height: 1;
    pointer-events: none; animation: crownDrop 1.15s cubic-bezier(.3,1.6,.3,1) 0.1s both,
      crownPopWiggle 2.2s ease-in-out 1.25s infinite; z-index: 6;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
  }
  @keyframes crownDrop {
    0%   { transform: translate(-50%, -48px) scale(0) rotate(-55deg); opacity: 0; }
    55%  { transform: translate(-50%, 12px) scale(1.7) rotate(22deg); opacity: 1; }
    100% { transform: translate(-50%, 0) scale(1.25) rotate(0deg); opacity: 1; }
  }
  @keyframes crownPopWiggle {
    0%, 100% { transform: translate(-50%, 0) scale(1.25) rotate(-9deg); }
    50%      { transform: translate(-50%, 0) scale(1.25) rotate(9deg); }
  }
  .crown-btn {
    font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase;
    align-self: stretch; background: var(--gold); color: var(--ink); border: none; border-radius: 6px;
    padding: 6px 8px; font-weight: 700; cursor: pointer; margin-top: auto;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .crown-btn:active { transform: scale(0.94); }
  .crown-btn[disabled] { opacity: 0.5; cursor: default; }

  /* Full-screen winner broadcast (see showWinnerOverlay() in the script).
     Every client -- not just the judge who clicked "crown winner" -- shows
     this the moment it learns who won: the judge gets it straight from
     POST /api/choose's response, everyone else picks it up off their next
     4-second poll via GET /api/state's `previousWinner` field. Tap anywhere
     to dismiss early; otherwise it clears itself after a few seconds. */
  .winner-overlay {
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 28px;
    background: rgba(12, 11, 16, 0.88); text-align: center; cursor: pointer;
    animation: overlayFadeIn 0.5s ease both;
    /* The bg darkens further once .dim-stage lands (see showWinnerOverlay) --
       this is what lets the card behind the verdict text actually recede. */
    transition: background 0.6s ease;
  }
  .winner-overlay.leaving { animation: overlayFadeOut 0.5s ease both; }
  .winner-overlay.dim-stage { background: rgba(4, 3, 6, 0.97); }
  @keyframes overlayFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes overlayFadeOut { from { opacity: 1; } to { opacity: 0; } }
  /* Slowed down + exaggerated further per Jon's ask -- a longer, bigger
     entrance for every piece, and slower, wider idle loops once everything
     has landed (there's more hold time now that the overlay stays up for
     5.5s instead of 3.2s, so the loops can afford to breathe more too). */
  .overlay-crown {
    font-size: 5.6rem; line-height: 1; filter: drop-shadow(0 10px 22px rgba(0,0,0,0.6));
    animation: overlayCrownDrop 1.3s cubic-bezier(.22,1.7,.36,1) 0.05s both,
      overlayCrownWiggle 2.2s ease-in-out 1.35s infinite;
    transition: opacity 0.6s ease;
  }
  @keyframes overlayCrownDrop {
    0%   { transform: translateY(-220px) scale(0.15) rotate(-60deg); opacity: 0; }
    55%  { transform: translateY(34px) scale(1.45) rotate(24deg); opacity: 1; }
    75%  { transform: translateY(-16px) scale(1.08) rotate(-10deg); }
    100% { transform: translateY(0) scale(1) rotate(0deg); }
  }
  @keyframes overlayCrownWiggle {
    0%, 100% { transform: rotate(-10deg); }
    50%      { transform: rotate(10deg); }
  }
  /* Once the crown lands and .dim-stage is added (see showWinnerOverlay),
     the crown backs off -- it stops wiggling and fades down -- so it
     doesn't compete with the verdict text for attention. */
  .winner-overlay.dim-stage .overlay-crown {
    opacity: 0.35; animation-play-state: paused;
  }
  .overlay-card {
    width: 100%; max-width: 240px; aspect-ratio: 5 / 6.4; background: var(--ivory); color: var(--ink);
    border-radius: 12px; padding: 18px; font-family: var(--font-card); font-weight: 800; font-size: 1.02rem;
    line-height: 1.3; display: flex; align-items: center; justify-content: center; text-align: center;
    box-shadow: 0 0 0 4px var(--gold), 0 0 40px rgba(217,164,65,0.65), 0 22px 40px var(--shadow);
    animation: overlayCardIn 0.9s cubic-bezier(.22,1.7,.36,1) 0.3s both,
      overlayCardGlow 1.9s ease-in-out 1.2s infinite;
    transform: scale(1) rotate(-1.5deg); transition: filter 0.6s ease, transform 0.6s ease;
  }
  @keyframes overlayCardIn {
    0%   { opacity: 0; transform: scale(0.25) rotate(18deg) translateY(70px); }
    100% { opacity: 1; transform: scale(1) rotate(-1.5deg) translateY(0); }
  }
  @keyframes overlayCardGlow {
    0%, 100% { box-shadow: 0 0 0 4px var(--gold), 0 0 40px rgba(217,164,65,0.65), 0 22px 40px var(--shadow); }
    50%      { box-shadow: 0 0 0 9px var(--gold), 0 0 90px rgba(217,164,65,1), 0 22px 40px var(--shadow); }
  }
  /* The dim: once the crown's on, the card itself gets shoved into the
     background -- animation killed outright (so the glow-pulse stops dead
     instead of fighting the filter), shrunk and darkened hard enough that
     its own printed text stops competing for reading attention. This is
     what makes the verdict layer below read as the actual focal point
     instead of one more thing sharing the screen with a glowing card. */
  .winner-overlay.dim-stage .overlay-card {
    animation: none; filter: brightness(0.14) saturate(0.3) blur(0.5px);
    transform: scale(0.82) rotate(-1.5deg);
    box-shadow: 0 0 0 4px rgba(217,164,65,0.18), 0 14px 26px var(--shadow);
  }
  /* The verdict: name + insult, lifted out of the normal flow and slammed
     down centered over the whole screen, at a permanent slant -- a stamped
     verdict, not a caption under the card. This is the actual "focal
     point" beat Jon asked for; everything else on screen exists to set it
     up and then get out of its way. The soft radial scrim behind the text
     is what keeps it legible over the dimmed card sitting right behind it. */
  .overlay-verdict {
    position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 36px;
    text-align: center; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, rgba(4,3,6,0.85) 0%, rgba(4,3,6,0.65) 55%, rgba(4,3,6,0) 78%);
  }
  .winner-overlay.dim-stage .overlay-verdict {
    animation: verdictSlam 0.65s cubic-bezier(.19,1.55,.28,1) both;
  }
  @keyframes verdictSlam {
    0%   { opacity: 0; transform: scale(2.4) rotate(-2deg); }
    55%  { opacity: 1; transform: scale(0.9) rotate(-8deg); }
    78%  { transform: scale(1.06) rotate(-4deg); }
    100% { opacity: 1; transform: scale(1) rotate(-6deg); }
  }
  .overlay-name {
    font-family: var(--font-display); font-style: italic; font-weight: 700; color: var(--gold);
    font-size: 2.15rem; line-height: 1.15; text-wrap: balance;
    text-shadow: 0 8px 30px rgba(0,0,0,0.9);
  }
  .overlay-insult {
    font-family: var(--font-card); font-weight: 700; color: var(--ivory); font-size: 1.18rem;
    line-height: 1.35; max-width: 320px; text-wrap: balance;
    text-shadow: 0 6px 24px rgba(0,0,0,0.9);
  }
  .overlay-hint {
    position: absolute; left: 0; right: 0; bottom: 26px; z-index: 7;
    font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.06em; color: var(--muted);
    text-transform: uppercase; animation: overlayTextIn 0.7s ease 1.25s both;
  }
  @keyframes overlayTextIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .waiting-note {
    font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted);
    text-align: center; letter-spacing: 0.03em; padding: 6px;
  }

  .toast {
    font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 0.95rem;
    color: var(--ivory); background: var(--felt-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px; text-align: center; text-wrap: balance;
  }
  .toast strong { font-style: normal; font-weight: 700; color: var(--gold); }

  .refresh-btn {
    font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.04em;
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 14px; cursor: pointer; align-self: center;
  }
  .refresh-btn:hover { color: var(--ivory); border-color: var(--gold); }

  footer.foot {
    text-align: center; font-family: var(--font-mono); font-size: 0.6rem;
    color: var(--muted); letter-spacing: 0.04em; padding-top: 6px; opacity: 0.7;
  }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .black-card, .flip-inner, .flip-card, .white-card, .play-btn, .crown-btn, .crown-pop {
      transition: none !important; animation: none !important;
    }
    .winner-overlay, .overlay-crown, .overlay-card, .overlay-verdict, .overlay-name, .overlay-insult, .overlay-hint {
      transition: none !important; animation: none !important; opacity: 1 !important; transform: none !important;
    }
    .winner-overlay.dim-stage .overlay-card { filter: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <h1>We Should Be Ashamed...</h1>
    <span class="badge" id="liveBadge">LIVE</span>
  </div>

  <div class="devbar" id="devBar" hidden>
    <input id="devChat" placeholder="chat id" />
    <input id="devUser" placeholder="your telegram id" />
    <button id="devGo">Connect</button>
  </div>

  <div class="readout" id="readout" hidden>
    <span class="turn" id="turnNo">TURN --</span>
    <span class="role" id="roleLabel"></span>
  </div>

  <div class="stage" id="stage">
    <div class="msg" id="statusMsg">Connecting…</div>
  </div>

  <button class="refresh-btn" id="refreshBtn" hidden>refresh</button>

  <footer class="foot">reads/writes the same <code>hands</code> / <code>chats</code> tables the Telegram bot uses</footer>
</div>

<script>
(function () {
  'use strict';

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  const params = new URLSearchParams(location.search);
  let chatId = params.get('chat') || '';
  let devUserId = params.get('user') || '';
  const hasTelegramAuth = !!(tg && tg.initData);

  const $ = (id) => document.getElementById(id);

  // Dev connection bar: always shown outside Telegram (LAN browser testing,
  // REQUIRE_TELEGRAM_AUTH must be "false" for the ?user= fallback below to
  // be accepted -- see server.js), and ALSO shown as a rescue hatch inside
  // Telegram if we somehow got opened without a ?chat= in the URL -- e.g.
  // Telegram's WebView reusing/caching an earlier session for this bot's
  // Mini App. Without this fallback there was previously no way to recover:
  // the "enter a chat id" message had nowhere to actually enter one.
  if (!hasTelegramAuth) {
    $('liveBadge').textContent = 'DEV MODE';
  }
  if (!hasTelegramAuth || !chatId) {
    $('devBar').hidden = false;
    $('devUser').hidden = hasTelegramAuth; // real auth already carries who you are
    $('devChat').value = chatId;
    $('devUser').value = devUserId;
    $('devGo').addEventListener('click', () => {
      chatId = $('devChat').value.trim();
      devUserId = $('devUser').value.trim();
      const url = new URL(location.href);
      url.searchParams.set('chat', chatId);
      if (!hasTelegramAuth) url.searchParams.set('user', devUserId);
      history.replaceState(null, '', url);
      poll();
    });
  }

  let selectedHandId = null;
  let pollTimer = null;
  // Tracks the last turn number we actually painted a black card for, so
  // render() can tell "a new card was just dealt" apart from "the 4-second
  // poll fired again and nothing changed" -- see the .deal-in class below.
  let lastBlackCardTurn = null;
  // Tracks the last round we already showed a winner celebration for, so a
  // client doesn't replay it on every subsequent poll of the same turn --
  // and, on first load, so a client that just opened the app doesn't replay
  // history for a round that finished before it connected. See render()'s
  // "initialStateLoaded" handling below.
  let lastShownWinnerTurn = null;
  let initialStateLoaded = false;

  // Deliberately petty, not actually hateful -- same spirit as the game's
  // own cards. Every line takes the winner's real name; one is picked at
  // random per celebration.
  const HORRIBLE_THINGS = [
    '{name} definitely microwaves fish in the office break room.',
    "{name} unplugs your charger to charge their own phone. Every time.",
    '{name} swaps price tags at yard sales.',
    '{name} claps when the plane lands. Every single flight.',
    "{name} takes the last slice and just... doesn't say anything.",
    "{name} 100% reclines their airplane seat all the way back, immediately.",
    "{name} has 'reply all'-ed something they really shouldn't have.",
    "{name} lets their dog do its business on your lawn and speed-walks away.",
    '{name} eats the last cookie and puts the empty box back in the pantry.',
    "{name} would let you walk around with spinach in your teeth all day.",
    "{name} pretends to be asleep so they don't have to help carry the groceries in.",
    '{name} takes credit for the group project, and nobody stops them.',
    "{name} regifts things without checking for the original gift tag first.",
    '{name} chews with their mouth open and dares you to say something.',
    "{name} has never once returned a shopping cart to the corral.",
    '{name} double-dips. Every party. Every time.',
    "{name} goes quiet in the group chat right when it's their turn to pay.",
    "{name} 'forgets' their wallet at dinner with suspicious consistency.",
    "{name} watches the finale without you and says nothing about it for a week.",
    '{name} definitely peeked at the presents before the birthday.',
    '{name} leaves one-star reviews just to feel something.',
    "{name} still owes somebody twenty bucks from a long time ago.",
    '{name} talks during movies. Loudly. With opinions.',
    "{name} says 'we should hang out sometime' and means nothing by it.",
    '{name} screenshots the group chat and definitely could send it to the wrong one on purpose.',
    "{name} 'accidentally' likes a three-year-old photo just to see what happens.",
    '{name} is exactly the kind of person who wins Cards Against Humanity and feels great about it.',
    // Darker batch -- same "absurd indictment of someone's character" spirit
    // as the game's own cards, just turned up. Kept to adult territory on
    // purpose: crime, death, cults, addiction, betrayal. Nothing here
    // involves minors in any way -- that line doesn't move, no matter how
    // dark the rest of this gets.
    '{name} definitely has a burner phone for reasons nobody wants explained.',
    "{name} knows exactly how long a body takes to fully decompose in a bathtub, and won't say why.",
    '{name} has a "day drinking" tab that predates most of their relationships.',
    '{name} cried at the will reading, but only because they got less than the dog.',
    "{name} has an OnlyFans they're fairly sure nobody in this group chat has found yet.",
    '{name} once faked a family emergency to get out of a Tuesday.',
    '{name} has definitely Googled "how to disappear and start over."',
    "{name} tells people they're 'spiritual' to get out of paying for things.",
    "{name} has a spreadsheet ranking their friends by usefulness. You're not top five.",
    '{name} let a cult recruit them for the free snacks and never quite left.',
    '{name} still owes an apology to at least one ex-spouse and several former coworkers.',
    '{name} has strong, detailed opinions on how to get away with tax fraud.',
    '{name} would absolutely sell your kidney on the black market if the exchange rate was right.',
    '{name} takes a suspiciously long "grief nap" after every funeral that isn\'t actually about grief.',
    '{name} once let a whole Ponzi scheme keep running because the returns were, admittedly, incredible.',
    "{name} has a burial plot picked out next to someone they haven't told yet.",
    '{name} has thoughts about body disposal that go well past "podcast fan."',
    '{name} has never once felt bad about ghosting someone mid-crisis.',
    "{name} keeps a 'just in case' fake passport. Nobody's asked why.",
    '{name} scammed a scammer once and considers it the high point of their year.',
    '{name} would 100% let a family member take the fall for something they did.',
    '{name} finds funerals a great networking opportunity.',
    '{name} got a whole department reorganized out of spite and called it "just how it worked out."',
    "{name} has a burner identity for online arguments about things they don't even believe.",
    '{name} thinks about arson more than is medically advisable.',
    '{name} keeps a list of enemies with more names on it than the guest list has friends.',
    '{name} has definitely lied under oath, with a smile, and slept fine that night.',
    '{name} would trade you for a slightly better seat on the plane without blinking.',
    '{name} has strong feelings about which relative would be easiest to write out of the will.',
    '{name} was banned from a cruise line and has never once explained why.',
    '{name} still hasn\'t returned the ashes they were "just holding onto" for a friend.',
    '{name} let an entire wedding think the open bar was still open, for the chaos of it.',
    '{name} has a personal policy that no funeral is too soon to start dating again.',
    '{name} has read enough about untraceable poisons to make a toxicologist nervous.',
    '{name} has a burner alibi ready for any night of the week, just in case.',
    '{name} talked at least one elderly relative into changing their will out of pure charm.',
    '{name} thinks "it was just a prank" covers a surprising amount of felony-adjacent behavior.',
    '{name} keeps a shrine to an ex they claim, loudly and often, to hate.',
    '{name} would let you take the blame in a group project, a marriage, and a minor felony.',
    '{name} has personally been the reason a support group needed a new support group.',
    '{name} keeps receipts on everyone, for reasons that are never, ever good.',
    '{name} once had a "business trip" that was not, in any legal sense, a business trip.',
    '{name} talked their way out of a paternity test on pure charisma alone.',
    '{name} has strong, unsettling opinions about which relative "had it coming."',
    '{name} has practiced a eulogy for someone who is still very much alive.',
    '{name} would sell out this entire group chat for a marginally better parking spot.',
    '{name} has an exit strategy for this friendship they have never once mentioned out loud.',
    '{name} got a restraining order and still, to this day, thinks it was a misunderstanding.',
    '{name} has genuinely mapped out which cult would take them, as a backup plan.',
    '{name} has a "no bodies, no crime" T-shirt they only wear ironically. Probably.',
  ];
  function randomInsult(name) {
    const line = HORRIBLE_THINGS[Math.floor(Math.random() * HORRIBLE_THINGS.length)];
    return line.replace('{name}', name);
  }

  // Shows the big full-screen "so-and-so won!" broadcast. Resolves once
  // it's been dismissed (auto after a few seconds, or on tap) -- callers
  // that need to wait for it (the judge's own crownWinner flow) can await
  // it; callers that don't (a bystander client picking it up off a poll)
  // can just fire it and move on.
  function showWinnerOverlay(winner) {
    return new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.className = 'winner-overlay';

      const crown = document.createElement('div');
      crown.className = 'overlay-crown';
      crown.textContent = '👑';
      overlay.appendChild(crown);

      const card = document.createElement('div');
      card.className = 'overlay-card';
      card.textContent = winner.cardText || '';
      overlay.appendChild(card);

      // Name + insult live in their own layer, absolutely centered over
      // everything else, so they can be slammed in as ONE focal unit once
      // the dim hits -- see .overlay-verdict / verdictSlam above.
      const verdict = document.createElement('div');
      verdict.className = 'overlay-verdict';

      const name = document.createElement('div');
      name.className = 'overlay-name';
      name.textContent = winner.name + ' wins the round!';
      verdict.appendChild(name);

      const insult = document.createElement('div');
      insult.className = 'overlay-insult';
      insult.textContent = randomInsult(winner.name);
      verdict.appendChild(insult);

      overlay.appendChild(verdict);

      const hint = document.createElement('div');
      hint.className = 'overlay-hint';
      hint.textContent = 'tap to continue';
      overlay.appendChild(hint);

      let done = false;
      const dismiss = () => {
        if (done) return;
        done = true;
        clearTimeout(dimTimer);
        clearTimeout(timer);
        overlay.classList.add('leaving');
        overlay.addEventListener('animationend', () => { overlay.remove(); resolve(); }, { once: true });
        // Safety net in case the leaving animation never fires (e.g. the
        // element got detached some other way) -- don't hang forever.
        setTimeout(() => { if (overlay.isConnected) overlay.remove(); resolve(); }, 500);
      };
      overlay.addEventListener('click', dismiss);

      // Sequenced beats: crown drops + card flies in first (0 - ~1.3s),
      // THEN the card dims, the screen darkens further, and the verdict
      // (name + insult) slams in centered and slanted as the actual focal
      // point -- settled by ~2.1s, held on screen by itself for a further
      // ~6.5s (there's enough text in the longer insults now that it needs
      // real reading time, not just a beat) before the whole thing
      // dismisses.
      const dimTimer = setTimeout(() => overlay.classList.add('dim-stage'), 1450);
      const timer = setTimeout(dismiss, 8600);

      document.body.appendChild(overlay);
    });
  }

  function headers(extra) {
    const h = Object.assign({ 'Content-Type': 'application/json' }, extra || {});
    if (hasTelegramAuth) h['X-Telegram-Init-Data'] = tg.initData;
    return h;
  }

  function apiUrl(path) {
    const url = new URL(path, location.origin);
    if (!hasTelegramAuth && devUserId) url.searchParams.set('user', devUserId);
    return url;
  }

  async function fetchState() {
    if (!chatId) {
      // Debug breadcrumb: this tells us whether Telegram actually dropped
      // the ?chat= we put in the button's URL, or handed us something else
      // entirely (e.g. a cached/reused WebView from an earlier open).
      showMessage(
        'Enter a chat id above to connect to a real game. (debug: url=' + location.href + ')',
        false,
      );
      return;
    }
    const url = apiUrl('/api/state');
    url.searchParams.set('chat', chatId);
    try {
      const res = await fetch(url, { headers: headers(), cache: 'no-store' });
      const data = await res.json();
      if (!res.ok) return showApiError(res.status, data);
      render(data);
    } catch (err) {
      showMessage('Could not reach the game server — ' + err.message, true);
    }
  }

  function showApiError(status, data) {
    const messages = {
      missing_telegram_auth: 'Not authenticated. Open this from the Telegram bot, or (for LAN testing) set REQUIRE_TELEGRAM_AUTH=false on the server and enter a dev user id above.',
      invalid_init_data: "Telegram signature didn't check out — this shouldn't happen from inside the real app.",
      no_active_game: 'No open game in that chat yet. Start one with /start in the Telegram group first.',
      player_not_found: "You're not in this game yet — send /start in the group first.",
    };
    showMessage(messages[data.error] || (data.error || ('HTTP ' + status)), true);
  }

  function showMessage(text, isError) {
    $('readout').hidden = true;
    $('refreshBtn').hidden = true;
    $('stage').innerHTML = '<div class="msg' + (isError ? ' err' : '') + '">' + escapeHtml(text) + '</div>';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function render(data) {
    if (data.status === 'waiting_for_players') {
      showMessage('Waiting on players — ' + data.players + ' joined so far. Need at least 3 (counting Rando Carlissian) to deal in.', false);
      return;
    }

    // Broadcast celebration: catches a round win for every client that
    // DIDN'T just personally click "crown winner" (that client gets its
    // own immediate celebration straight from crownWinner() below instead,
    // and marks lastShownWinnerTurn itself so this doesn't double-fire for
    // them). On the very first poll after loading the page, just record
    // the baseline silently -- otherwise reopening the app mid-game would
    // replay a celebration for a round that finished before you connected.
    if (!initialStateLoaded) {
      initialStateLoaded = true;
      lastShownWinnerTurn = data.previousWinner ? data.previousWinner.turn : null;
    } else if (data.previousWinner && data.previousWinner.turn !== lastShownWinnerTurn) {
      lastShownWinnerTurn = data.previousWinner.turn;
      showWinnerOverlay(data.previousWinner);
    }

    $('readout').hidden = false;
    $('refreshBtn').hidden = false;
    $('turnNo').textContent = 'TURN ' + String(data.turn).padStart(2, '0');
    $('roleLabel').textContent = data.role === 'judge' ? 'You are judging' : 'You are playing';

    const stage = $('stage');
    stage.innerHTML = '';

    // Only play the "dealt onto the table" entrance when a NEW black card
    // actually showed up (turn number changed since we last painted one).
    // Without this check every 4-second poll tick -- even ones where
    // nothing changed -- tore the stage down and rebuilt it, replaying the
    // entrance animation forever instead of once per real new card.
    const isNewTurn = data.turn !== lastBlackCardTurn;
    lastBlackCardTurn = data.turn;

    const black = document.createElement('div');
    black.className = 'black-card' + (isNewTurn ? ' deal-in' : '');
    black.innerHTML =
      '<p>' + escapeHtml(data.blackCard ? data.blackCard.text : '…') + '</p>' +
      '<span class="pick-tag">PICK ' + (data.blackCard ? data.blackCard.pick : 1) + '</span>';
    stage.appendChild(black);

    if (data.role === 'judge') renderJudge(stage, data);
    else renderPlayer(stage, data);
  }

  function renderPlayer(stage, data) {
    const label = document.createElement('div');
    label.className = 'hand-label';
    label.textContent = data.needsToPlay > 0
      ? 'Your hand — tap a card, then play it'
      : 'Card(s) played — waiting on the table';
    stage.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'hand-grid';
    data.hand.forEach((card) => {
      const el = document.createElement('div');
      el.className = 'white-card' + (selectedHandId === card.handId ? ' selected' : '') +
        (data.needsToPlay <= 0 ? ' disabled' : '');
      el.textContent = card.text;
      el.tabIndex = 0;
      el.dataset.handId = String(card.handId);
      el.setAttribute('role', 'button');
      // NOTE: this deliberately does NOT call render(data) -- it toggles
      // the 'selected' class on the existing elements in place instead, so
      // the CSS transition on .white-card actually has something to
      // animate FROM. Tearing the whole grid down and rebuilding it (the
      // old approach) meant every card was always brand new the instant it
      // got the 'selected' class, so there was nothing to transition from
      // and the "pop" never played -- it just snapped.
      el.addEventListener('click', () => selectCard(card.handId, data));
      grid.appendChild(el);
    });
    stage.appendChild(grid);

    const bar = document.createElement('div');
    bar.className = 'play-bar';
    const btn = document.createElement('button');
    btn.className = 'play-btn';
    btn.id = 'playBtn';
    btn.addEventListener('click', () => playCard(selectedHandId));
    bar.appendChild(btn);
    stage.appendChild(bar);
    updatePlayBtn(data);

    const note = document.createElement('div');
    note.className = 'played-note';
    note.textContent = data.needsToPlay <= 0 ? 'Waiting on the rest of the table…' : '';
    stage.appendChild(note);
  }

  // Toggles selection on the actual DOM elements (rather than re-rendering
  // the whole hand) so the .white-card select/deselect transition can play.
  function selectCard(handId, data) {
    if (data.needsToPlay <= 0) return;
    const grid = document.querySelector('.hand-grid');
    if (!grid) return;
    const prev = grid.querySelector('.white-card.selected');
    if (prev) prev.classList.remove('selected');
    selectedHandId = selectedHandId === handId ? null : handId;
    if (selectedHandId !== null) {
      const el = grid.querySelector('[data-hand-id="' + selectedHandId + '"]');
      if (el) el.classList.add('selected');
    }
    updatePlayBtn(data);
  }

  function updatePlayBtn(data) {
    const btn = $('playBtn');
    if (!btn) return;
    btn.disabled = selectedHandId === null || data.needsToPlay <= 0;
    if (!btn.disabled) {
      const card = data.hand.find((c) => c.handId === selectedHandId);
      const label = card ? card.text : '';
      btn.textContent = 'Play "' + (label.length > 26 ? label.slice(0, 26) + '…' : label) + '"';
    } else {
      btn.textContent = '';
    }
  }

  function renderJudge(stage, data) {
    const label = document.createElement('div');
    label.className = 'hand-label';
    label.textContent = data.revealed
      ? 'Tap each card to flip it, then crown a winner'
      : 'Waiting for everyone to play';
    stage.appendChild(label);

    if (!data.revealed) {
      const note = document.createElement('div');
      note.className = 'waiting-note';
      note.textContent = 'This refreshes automatically once everyone has submitted.';
      stage.appendChild(note);
      return;
    }

    const row = document.createElement('div');
    row.className = 'judge-row';
    data.submissions.forEach((sub) => {
      const cell = document.createElement('div');
      cell.className = 'flip-card';
      const inner = document.createElement('div');
      inner.className = 'flip-inner';

      const back = document.createElement('div');
      back.className = 'flip-face flip-back';
      back.innerHTML = '<span class="emblem" aria-hidden="true"></span>';
      back.addEventListener('click', () => { cell.classList.add('flipped'); });

      const front = document.createElement('div');
      front.className = 'flip-face flip-front';
      const text = sub.cards.map((c) => c.text).join(' / ');
      front.innerHTML = '<div>' + escapeHtml(text) + '</div>';
      const crown = document.createElement('button');
      crown.className = 'crown-btn';
      crown.textContent = 'Crown winner';
      crown.addEventListener('click', (e) => {
        e.stopPropagation();
        crownWinner(sub.submissionToken, cell, row, label);
      });
      front.appendChild(crown);

      inner.appendChild(back);
      inner.appendChild(front);
      cell.appendChild(inner);
      row.appendChild(cell);
    });
    stage.appendChild(row);
  }

  async function playCard(handId) {
    if (handId === null) return;
    try {
      const res = await fetch(apiUrl('/api/play'), {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ chat: chatId, handId }),
      });
      const data = await res.json();
      if (!res.ok) return showApiError(res.status, data);
      selectedHandId = null;
      fetchState();
    } catch (err) {
      showMessage('Play failed — ' + err.message, true);
    }
  }

  // Commits the pick to the server first (so we only celebrate a pick that
  // actually succeeded), then plays a short winner/loser animation on the
  // cards already on screen, THEN swaps in the new round -- instead of the
  // old behavior of jumping straight to the next round with no moment for
  // the winning card at all.
  async function crownWinner(submissionToken, winnerCell, rowEl, labelEl) {
    if (rowEl.classList.contains('deciding')) return; // already crowning one, ignore extra taps
    rowEl.classList.add('deciding');
    rowEl.querySelectorAll('.crown-btn').forEach((b) => { b.disabled = true; });
    try {
      const res = await fetch(apiUrl('/api/choose'), {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ chat: chatId, submissionToken }),
      });
      const data = await res.json();
      if (!res.ok) {
        rowEl.classList.remove('deciding');
        rowEl.querySelectorAll('.crown-btn').forEach((b) => { b.disabled = false; });
        return showApiError(res.status, data);
      }

      // Pause the poll timer so it can't yank the celebration away
      // mid-animation, then resume (via poll(), not fetchState()) once it's
      // done -- poll() both fetches immediately and resets the interval.
      clearInterval(pollTimer);
      rowEl.querySelectorAll('.flip-card').forEach((c) => {
        c.classList.add(c === winnerCell ? 'winner' : 'loser');
      });
      const pop = document.createElement('span');
      pop.className = 'crown-pop';
      pop.textContent = '👑';
      winnerCell.appendChild(pop);
      if (labelEl) labelEl.textContent = 'Winner crowned! Next round starting…';

      // We already know who won and what they played -- it came straight
      // back in this response -- so the judge's own client doesn't need to
      // wait for a poll to run the same big broadcast celebration everyone
      // else will see. Mark it shown now so the next poll (which will
      // include this same round in previousWinner) doesn't replay it here.
      if (data.previousWinner) lastShownWinnerTurn = data.previousWinner.turn;
      // Longer pause now that the local grid celebration (crownPulse +
      // crown-pop) itself runs longer -- let it actually finish landing
      // before the big overlay takes over the screen.
      setTimeout(async () => {
        if (data.previousWinner) await showWinnerOverlay(data.previousWinner);
        poll();
      }, 950);
    } catch (err) {
      rowEl.classList.remove('deciding');
      rowEl.querySelectorAll('.crown-btn').forEach((b) => { b.disabled = false; });
      showMessage('Choosing a winner failed — ' + err.message, true);
    }
  }

  function poll() {
    fetchState();
    clearInterval(pollTimer);
    pollTimer = setInterval(fetchState, 4000);
  }

  $('refreshBtn').addEventListener('click', fetchState);

  poll();
})();
</script>
</body>
</html>
