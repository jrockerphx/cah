# Three services sharing one Postgres database:
#   postgres  - the database (see the big warning below before renaming it)
#   cah_bot   - the Rust/Telegram bot
#   cah_web   - the Mini App (Express API + static frontend the bot's
#               "Open cards hand" button opens as a Telegram WebApp)
#
# ---------------------------------------------------------------------------
# IMPORTANT: cah_bot's database connection string is hardcoded in the Rust
# source (see src/main.rs) as:
#
#     postgres://postgres:postgres@postgres/cah_bot
#
# It is NOT read from an environment variable. That means the service below
# named "postgres" must keep that exact name (Compose's DNS resolves the
# hostname "postgres" to this container), and POSTGRES_USER / PASSWORD / DB
# below must stay postgres / postgres / cah_bot. If you need different
# credentials, patch src/main.rs and rebuild the bot image — don't just
# edit this file, the bot will silently fail to connect.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cah_bot
    volumes:
      - cah_pgdata:/var/lib/postgresql/data
      - ./schema.postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  cah_bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_NAME: ${BOT_NAME}
      # Base URL of the Mini App below. Leave unset/empty to fall back to
      # the original inline-query "hand of cards" flow with no Mini App at
      # all. Must be https:// — Telegram refuses http:// WebApp URLs.
      WEBAPP_URL: ${WEBAPP_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  cah_web:
    build:
      context: ./webapp
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres/cah_bot
      BOT_TOKEN: ${BOT_TOKEN}
      PORT: 3001
      REQUIRE_TELEGRAM_AUTH: "true"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cah_pgdata:
