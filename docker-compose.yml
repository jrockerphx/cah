# Coolify "Docker Compose" resource for nappa85/cah_bot
#
# WHY THIS SHAPE:
# The bot's source hardcodes its DB connection string as:
#   postgres://postgres:postgres@postgres/cah_bot
# It does NOT read a DATABASE_URL env var. That means whatever runs the
# bot must be able to resolve the hostname "postgres" to the Postgres
# container, with that exact user/password/db name. Docker Compose gives
# every service a DNS entry matching its service name for free, so naming
# the db service "postgres" here satisfies the hardcoded string without
# touching the bot's Rust source.
#
# The official postgres image auto-runs any .sql file dropped into
# /docker-entrypoint-initdb.d/ the FIRST time it starts on an empty data
# volume — so mounting schema.postgres.sql there replaces the manual
# "psql -f schema.sql" step, and only runs once (safe on restarts/redeploys).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cah_bot
    volumes:
      - cah_bot_pgdata:/var/lib/postgresql/data
      - ./schema.postgres.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Gives Postgres up to 2 extra minutes before the healthcheck can fail
      # it. On a cold start, if the cah_bot image is also being pulled/built
      # at the same time, disk I/O contention can push init past the plain
      # 50s window (5s x 10 retries) and Coolify tears the stack down with
      # "dependency failed to start: unhealthy" -- happened on first deploy.
      start_period: 120s

  cah_bot:
    # CHANGED: now points at YOUR repo instead of nappa85/cah_bot upstream
    # — same "cah" repo docker-compose.yml and schema.postgres.sql already
    # live in. Drop the cah_bot-fork.zip's contents (src/, Cargo.toml,
    # Cargo.lock, docker/, webapp/, cah-cards-full.json, .gitignore) into
    # this repo's root alongside the files already here, commit, push.
    #
    # Also fixed: the fork's Dockerfile now builds from this context
    # directly instead of re-cloning nappa85/cah_bot inside the build step
    # — that upstream quirk meant your build context (and any fork) was
    # silently ignored before. See the Dockerfile's own comment.
    build:
      context: https://github.com/jrockerphx/cah.git
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_NAME: ${BOT_NAME}
      # Leave blank until cah_web has a real https:// domain from Coolify —
      # unset/empty means the bot falls back to the original inline-query
      # "Open cards hand" flow exactly as it does today. Only fill this in
      # once you're ready to cut over (see cah_web's own build note below
      # about not running both flows against a live game at once).
      WEBAPP_URL: ${WEBAPP_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  # New: the HTML5 UI's backend. Reads/writes the exact same Postgres
  # tables cah_bot uses — see cah-webapp-api's own README (from chat) for
  # the endpoints and the gotchas before pointing real games at it.
  #
  # PORT: server.js listens on 3001 inside the container (Dockerfile EXPOSE
  # 3001, overridable via a PORT env var if you ever need to change it).
  # Coolify's own Traefik already owns 80/443 on this host, and you're
  # routing this through your own nginx gatekeeper box instead of Coolify's
  # domain/Traefik/Let's Encrypt flow — so the "ports:" line below publishes
  # 3001 straight to the host.
  #
  # TLS: server.js now terminates HTTPS itself, using a self-signed cert
  # baked into the image (webapp/certs/), to match nginx's usual "always
  # proxy_pass https:// to the backend" pattern. nginx's proxy_pass target
  # is https://192.168.0.206:3001 — remember to set `proxy_ssl_verify off;`
  # (or your usual equivalent) on that location block, since nothing signed
  # this cert and nginx will otherwise refuse it. The real public https://
  # URL Telegram needs for the WebApp button is still the one nginx serves;
  # this cert only covers the nginx→cah_web hop over your LAN.
  cah_web:
    build:
      context: https://github.com/jrockerphx/cah.git
      dockerfile: webapp/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres/cah_bot
      BOT_TOKEN: ${BOT_TOKEN}
      REQUIRE_TELEGRAM_AUTH: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cah_bot_pgdata:
